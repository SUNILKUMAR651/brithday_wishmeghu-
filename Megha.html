<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 जिस्से की फोटो गैलरी | Air Force Theme</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --gold: #d4af37;
            --navy: #0a1e2f;
            --cream: #fff8f0;
        }

        body {
            background: linear-gradient(165deg, #0a1e2f 0%, #132c42 30%, #1a3b54 60%, #0d2137 100%);
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #fff, transparent),
                radial-gradient(2px 2px at 40px 70px, #f0d080, transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(2px 2px at 160px 120px, #f0d080, transparent);
            background-size: 550px 150px;
            animation: twinkle 4s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .main-container {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .hero-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .airforce-badge {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.5rem;
            font-size: 2.5rem;
            color: var(--gold);
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.6));
        }

        .hero-name {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.7);
            letter-spacing: 3px;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: #a8c8e8;
            font-weight: 500;
        }

        /* Upload Button */
        .upload-container {
            text-align: center;
            margin: 1.5rem 0;
        }

        .upload-btn {
            background: linear-gradient(145deg, #f5e6a3, #d4af37);
            border: 2px solid #fff;
            color: #0a1e2f;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 1rem 2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.7rem;
        }

        .upload-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.5);
        }

        .upload-btn input {
            display: none;
        }

        .photo-count {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(212, 175, 55, 0.15);
            border: 2px solid var(--gold);
            border-radius: 50px;
            padding: 0.5rem 1.5rem;
            margin-top: 0.5rem;
            color: #f5e6a3;
            font-weight: 700;
        }

        /* Photo Grid */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            padding: 1rem 0.5rem;
        }

        .photo-frame {
            position: relative;
            background: linear-gradient(145deg, #f5e6a3, #c9a24c, #f5e6a3);
            border-radius: 20px;
            padding: 8px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.4),
                0 0 0 2px rgba(212, 175, 55, 0.5);
            aspect-ratio: 1 / 1;
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out both;
        }

        .photo-frame:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.6),
                0 0 0 3px rgba(212, 175, 55, 0.8),
                0 0 40px rgba(212, 175, 55, 0.5);
            z-index: 5;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .photo-frame-inner {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 14px;
            overflow: hidden;
            background: #0a1e2f;
        }

        .photo-frame-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .photo-frame:hover .photo-frame-inner img {
            transform: scale(1.1);
        }

        .frame-corner {
            position: absolute;
            width: 25px;
            height: 25px;
            border: 2px solid #fff;
            z-index: 3;
            pointer-events: none;
        }
        .frame-corner.tl { top: 4px; left: 4px; border-right: none; border-bottom: none; border-radius: 6px 0 0 0; }
        .frame-corner.tr { top: 4px; right: 4px; border-left: none; border-bottom: none; border-radius: 0 6px 0 0; }
        .frame-corner.bl { bottom: 4px; left: 4px; border-right: none; border-top: none; border-radius: 0 0 0 6px; }
        .frame-corner.br { bottom: 4px; right: 4px; border-left: none; border-top: none; border-radius: 0 0 6px 0; }

        .frame-wings {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 0.9rem;
            z-index: 5;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
        }

        .photo-number {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(10, 30, 47, 0.8);
            color: #f5e6a3;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            z-index: 4;
        }

        .delete-btn {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(255, 0, 0, 0.8);
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 6;
            font-size: 0.9rem;
            border: 2px solid #fff;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .photo-frame:hover .delete-btn {
            opacity: 1;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            cursor: pointer;
        }

        .lightbox.active { display: flex; }

        .lightbox img {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 15px;
            border: 5px solid var(--gold);
            box-shadow: 0 0 80px rgba(212, 175, 55, 0.6);
            object-fit: contain;
        }

        .lightbox-caption {
            color: #f5e6a3;
            font-size: 1.2rem;
            margin-top: 1rem;
            font-weight: 600;
        }

        .lightbox-close {
            position: absolute;
            top: 25px; right: 30px;
            color: #fff;
            font-size: 2.5rem;
            cursor: pointer;
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #fff;
            font-size: 2.5rem;
            cursor: pointer;
            padding: 1rem;
        }
        .lightbox-nav.prev { left: 20px; }
        .lightbox-nav.next { right: 20px; }

        .btn-celebrate {
            background: linear-gradient(145deg, #f5e6a3, #d4af37, #b8860b);
            border: 3px solid #fff;
            color: #0a1e2f;
            font-weight: 800;
            font-size: 1.2rem;
            padding: 1rem 2rem;
            border-radius: 60px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            margin: 2rem auto;
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.5);
            transition: all 0.3s;
        }

        .btn-celebrate:hover {
            transform: scale(1.05);
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            color: #a8c8e8;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .photo-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 1rem;
            }
        }

        @media (max-width: 480px) {
            .photo-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="main-container">
        
        <div class="hero-header">
            <div class="airforce-badge">
                <i class="fas fa-star"></i>
                <i class="fas fa-fighter-jet"></i>
                <i class="fas fa-crown"></i>
                <i class="fas fa-fighter-jet" style="transform: scaleX(-1);"></i>
                <i class="fas fa-star"></i>
            </div>
            
            <div class="hero-name">🎂 जिस्से 🎂</div>
            
            <div class="hero-subtitle">
                <i class="fas fa-medal"></i> एयरफोर्स की अनकही रानी <i class="fas fa-medal"></i>
            </div>
            
            <!-- Photo Upload Button -->
            <div class="upload-container">
                <label class="upload-btn">
                    <i class="fas fa-plus-circle"></i> अपनी Photos जोड़ें
                    <input type="file" id="photoUpload" accept="image/*" multiple>
                </label>
                <br>
                <div class="photo-count" id="photoCount">
                    <i class="fas fa-camera-retro"></i>
                    <span>0 Photos</span>
                </div>
            </div>
        </div>

        <div class="photo-grid" id="photoGrid"></div>

        <button class="btn-celebrate" id="celebrateBtn">
            <i class="fas fa-fighter-jet"></i>
            जिस्से के लिए सलामी
            <i class="fas fa-fighter-jet" style="transform: scaleX(-1);"></i>
        </button>

        <div class="footer">
            <i class="fas fa-star"></i> हमेशा मुस्कुराती रह • तेरा अपना स्काई गार्जियन <i class="fas fa-star"></i>
        </div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" id="lightboxClose">&times;</span>
        <span class="lightbox-nav prev" id="lightboxPrev"><i class="fas fa-chevron-left"></i></span>
        <img src="" alt="Photo" id="lightboxImage">
        <div class="lightbox-caption" id="lightboxCaption"></div>
        <span class="lightbox-nav next" id="lightboxNext"><i class="fas fa-chevron-right"></i></span>
    </div>

    <script>
        (function() {
            // Yahan apni photos daalein (agar manually add karni hain)
            const defaultPhotos = [
                // 'photos/photo1.jpg',
                // 'photos/photo2.jpg',
                // 'https://example.com/photo.jpg',
            ];
            
            let allPhotos = [...defaultPhotos];
            
            const photoGrid = document.getElementById('photoGrid');
            const photoCount = document.getElementById('photoCount');
            const lightbox = document.getElementById('lightbox');
            const lightboxImage = document.getElementById('lightboxImage');
            const lightboxCaption = document.getElementById('lightboxCaption');
            const lightboxClose = document.getElementById('lightboxClose');
            const lightboxPrev = document.getElementById('lightboxPrev');
            const lightboxNext = document.getElementById('lightboxNext');
            const photoUpload = document.getElementById('photoUpload');
            
            let currentPhotoIndex = 0;

            function renderGallery() {
                photoGrid.innerHTML = '';
                
                allPhotos.forEach((photoData, index) => {
                    const frame = document.createElement('div');
                    frame.className = 'photo-frame';
                    frame.style.animationDelay = `${(index % 20) * 0.05}s`;
                    
                    frame.innerHTML = `
                        <div class="frame-wings"><i class="fas fa-feather-alt"></i></div>
                        <span class="frame-corner tl"></span>
                        <span class="frame-corner tr"></span>
                        <span class="frame-corner bl"></span>
                        <span class="frame-corner br"></span>
                        <div class="photo-frame-inner">
                            <img src="${photoData}" alt="Photo ${index + 1}" loading="lazy">
                        </div>
                        <span class="photo-number">#${index + 1}</span>
                        <span class="delete-btn" data-index="${index}"><i class="fas fa-trash"></i></span>
                    `;
                    
                    frame.addEventListener('click', (e) => {
                        if (!e.target.closest('.delete-btn')) {
                            openLightbox(index);
                        }
                    });
                    
                    const deleteBtn = frame.querySelector('.delete-btn');
                    deleteBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deletePhoto(index);
                    });
                    
                    photoGrid.appendChild(frame);
                });
                
                updatePhotoCount();
            }

            function updatePhotoCount() {
                photoCount.innerHTML = `
                    <i class="fas fa-camera-retro"></i>
                    <span>${allPhotos.length} Photos</span>
                `;
            }

            function deletePhoto(index) {
                if (confirm('क्या आप इस फोटो को हटाना चाहते हैं?')) {
                    allPhotos.splice(index, 1);
                    renderGallery();
                }
            }

            // Photo Upload Function
            photoUpload.addEventListener('change', function(e) {
                const files = e.target.files;
                if (files.length === 0) return;
                
                for (let i = 0; i < files.length; i++) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        allPhotos.push(event.target.result);
                        renderGallery();
                    };
                    reader.readAsDataURL(files[i]);
                }
                
                // Reset input
                photoUpload.value = '';
            });

            // Lightbox functions
            function openLightbox(index) {
                currentPhotoIndex = index;
                updateLightbox();
                lightbox.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeLightbox() {
                lightbox.classList.remove('active');
                document.body.style.overflow = 'auto';
            }

            function updateLightbox() {
                lightboxImage.src = allPhotos[currentPhotoIndex];
                lightboxCaption.textContent = `Photo ${currentPhotoIndex + 1} / ${allPhotos.length}`;
            }

            function nextPhoto() {
                if (allPhotos.length === 0) return;
                currentPhotoIndex = (currentPhotoIndex + 1) % allPhotos.length;
                updateLightbox();
            }

            function prevPhoto() {
                if (allPhotos.length === 0) return;
                currentPhotoIndex = (currentPhotoIndex - 1 + allPhotos.length) % allPhotos.length;
                updateLightbox();
            }

            lightboxClose.addEventListener('click', closeLightbox);
            lightboxNext.addEventListener('click', (e) => { e.stopPropagation(); nextPhoto(); });
            lightboxPrev.addEventListener('click', (e) => { e.stopPropagation(); prevPhoto(); });
            
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) closeLightbox();
            });

            document.addEventListener('keydown', (e) => {
                if (!lightbox.classList.contains('active')) return;
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowRight') nextPhoto();
                if (e.key === 'ArrowLeft') prevPhoto();
            });

            // Celebration button
            document.getElementById('celebrateBtn').addEventListener('click', () => {
                for (let i = 0; i < 40; i++) createConfetti();
                
                const msg = document.createElement('div');
                msg.style.cssText = `
                    position: fixed;
                    top: 50%; left: 50%;
                    transform: translate(-50%, -50%);
                    background: rgba(10, 30, 47, 0.95);
                    color: #f5e6a3;
                    padding: 2rem 3rem;
                    border-radius: 3rem;
                    font-size: 1.8rem;
                    font-weight: 800;
                    z-index: 99999;
                    border: 3px solid #d4af37;
                    box-shadow: 0 0 80px rgba(212, 175, 55, 0.7);
                    text-align: center;
                `;
                msg.innerHTML = '🎂✨ जिस्से, जन्मदिन मुबारक! ✨🎂<br><span style="font-size:1.2rem;color:#a8c8e8;">तू एयरफोर्स की शान है! ✈️</span>';
                document.body.appendChild(msg);
                
                setTimeout(() => {
                    msg.style.transition = 'opacity 0.8s';
                    msg.style.opacity = '0';
                    setTimeout(() => msg.remove(), 800);
                }, 3000);
            });

            function createConfetti() {
                const confetti = document.createElement('div');
                const emojis = ['🎉', '⭐', '✈️', '🎂', '💛', '🌟', '🎊'];
                confetti.style.cssText = `
                    position: fixed;
                    top: -50px;
                    left: ${Math.random() * 100}%;
                    font-size: ${Math.random() * 20 + 15}px;
                    z-index: 99998;
                    pointer-events: none;
                    animation: confettiFall ${Math.random() * 2 + 2}s ease-in forwards;
                `;
                confetti.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 4000);
            }

            const styleSheet = document.createElement('style');
            styleSheet.textContent = `
                @keyframes confettiFall {
                    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
                    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
                }
            `;
            document.head.appendChild(styleSheet);

            // Initialize
            renderGallery();
            console.log('📸 Photo Gallery Ready!');
            console.log('💡 Apni photos add karne ke liye "अपनी Photos जोड़ें" button par click karein');
        })();
    </script>
</body>
</html>
